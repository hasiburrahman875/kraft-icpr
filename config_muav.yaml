      reid_weights: checkpoints/muav/fold2/reid_muav_fold2.pth
    min_output_track_length: 1
    link:
      enabled: false
  fold3:
    benchmark: MUAV-fold3
    split: test
    source: dataset/MUAV/fold3_mot/test
    det_dir: detections/muav-diffmot/fold3
