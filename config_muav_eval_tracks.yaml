dataset_type: muav
result_name: muav-eval-tracks
tracker_impl: kraft
run_mode: evaluate_tracks
report_metrics:
  - HOTA
  - DetA
  - AssA
  - MOTA
  - MOTP
  - IDF1
tracker_name: kraft-muav
dataset_root: dataset/MUAV
runtime:
  eval_at: 2100
  high_thres: 0.25
  med_thres: 0.10
  low_thres: 0.05
  lambda_kf: 0.60
  gamma: 0.50
  anti_swap_gain: 0.45
  anti_swap_angle_gain: 0.20
  max_center_frac: 0.08
  min_iou_gate: 0.05
  w_assoc_emb: 1.0
  aw_param: 1.0
  preprocess_workers: 16
  device: cuda
folds:
  fold1:
    benchmark: MUAV-fold1
    split: test
    source: dataset/MUAV/fold1_mot/test
    det_dir: detections/muav/yolov12fold1
    track_dir: tracks/muav/fold1
    runtime:
      checkpoint_path: checkpoints/muav/fold1/kraft_muav_fold1.pt
      reid_weights: checkpoints/muav/fold1/reid_muav_fold1.pth
    min_output_track_length: 1
    link:
      enabled: false
  fold2:
    benchmark: MUAV-fold2
    split: test
    source: dataset/MUAV/fold2_mot/test
    det_dir: detections/muav/yolov12fold2
    track_dir: tracks/muav/fold2
    runtime:
      checkpoint_path: checkpoints/muav/fold2/kraft_muav_fold2.pt
      reid_weights: checkpoints/muav/fold2/reid_muav_fold2.pth
    min_output_track_length: 1
    link:
      enabled: false
  fold3:
    benchmark: MUAV-fold3
    split: test
    source: dataset/MUAV/fold3_mot/test
    det_dir: detections/muav/yolov12fold3
    track_dir: tracks/muav/fold3
    runtime:
      checkpoint_path: checkpoints/muav/fold3/kraft_muav_fold3.pt
      reid_weights: checkpoints/muav/fold3/reid_muav_fold3.pth
    min_output_track_length: 1
    link:
      enabled: false
